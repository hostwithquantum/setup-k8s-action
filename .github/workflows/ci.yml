name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      with:
        persist-credentials: false
    - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4
      with:
        tool_versions: |
          action-validator 0.5.1
    - run: asdf reshim action-validator
    - run: action-validator ./action.yml
    - run: action-validator ./.github/workflows/ci.yml
    - run: action-validator ./.github/workflows/release.yml
    - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7

  test:
    needs: lint
    runs-on: ubuntu-latest
    name: test-${{ matrix.env }}
    strategy:
      matrix:
        env:
        - production
        - staging
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      with:
        persist-credentials: false
    - uses: ./
      with:
        config-production: |
          apiVersion: v1
          kind: Config
          current-context: default
          contexts:
          - name: default
            context:
              cluster: test
              user: test
          clusters:
          - name: test
            cluster:
              server: https://localhost:6443
          users:
          - name: test
            user: {}
        config-staging: |
          apiVersion: v1
          kind: Config
          current-context: default
          contexts:
          - name: default
            context:
              cluster: test
              user: test
          clusters:
          - name: test
            cluster:
              server: https://localhost:6443
          users:
          - name: test
            user: {}
        environment: ${{ matrix.env }}

  test_failure:
    needs: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      with:
        persist-credentials: false
    - uses: ./
      continue-on-error: true
      id: fail-step
      with:
        config-production: |
          apiVersion: v1
          kind: Config
          current-context: default
          contexts:
          - name: default
            context:
              cluster: test
              user: test
          clusters:
          - name: test
            cluster:
              server: https://localhost:6443
          users:
          - name: test
            user: {}
        config-staging: |
          apiVersion: v1
          kind: Config
          current-context: default
          contexts:
          - name: default
            context:
              cluster: test
              user: test
          clusters:
          - name: test
            cluster:
              server: https://localhost:6443
          users:
          - name: test
            user: {}
        environment: stage
    - if: steps.fail-step.outcome == 'success'
      run: exit 1
