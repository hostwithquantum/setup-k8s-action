name: 'setup-k8s-action'
description: 'Setup k8s tools and write kubeconfig to ~/.kube/config'
inputs:
  environment:
    required: true
    description: the environment to deploy to
    default: staging
  config-production:
    required: true
    description: k8s configuration for production
  config-staging:
    required: true
    description: k8s configuration for staging
outputs:
  kube-context:
    description: the name of the kubernetes context
    value: k8s-${{ inputs.environment }}
runs:
  using: "composite"
  steps:
  - shell: bash
    run: |
      echo "Unknown environment: ${ENVIRONMENT}"
      exit 1
    if: (inputs.environment != 'production' && inputs.environment != 'staging')
    env:
      ENVIRONMENT: ${{ inputs.environment }}
  - uses: yokawasa/action-setup-kube-tools@9d39563c24d4a419d1a8289c34d6da5a6171252c # v0.13.5
    with:
      kubectl: '1.31.2'
      # supports env vars > to secrets/configs
      kustomize: '4.5.7'
      setup-tools: |
        kubectl
        kustomize
        kubeconform
        helm
  - run: mkdir -p ~/.kube
    shell: bash
  - name: setup production
    run: |
      echo "${CONFIG}" > ~/.kube/config
      OLD_CONTEXT=$(kubectl config current-context)
      kubectl config rename-context "${OLD_CONTEXT}" "k8s-${ENVIRONMENT}"
      kubectl config use-context "k8s-${ENVIRONMENT}"
    if: inputs.environment == 'production'
    shell: bash
    env:
      CONFIG: ${{ inputs.config-production }}
      ENVIRONMENT: ${{ inputs.environment }}
  - name: setup staging
    run: |
      echo "${CONFIG}" > ~/.kube/config
      OLD_CONTEXT=$(kubectl config current-context)
      kubectl config rename-context "${OLD_CONTEXT}" "k8s-${ENVIRONMENT}"
      kubectl config use-context "k8s-${ENVIRONMENT}"
    if: inputs.environment == 'staging'
    shell: bash
    env:
      CONFIG: ${{ inputs.config-staging }}
      ENVIRONMENT: ${{ inputs.environment }}
